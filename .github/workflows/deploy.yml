name: Deploy

# Pushing to a deploy branch updates the live server when SSH secrets exist.
# Otherwise deploy from Settings → Deploy on the live site, or run this
# workflow from the Actions tab (Run workflow) and pick a branch.
on:
  push:
    branches:
      - main
      - cursor/modern-standalone-a34f
      - cursor/standby-highlight-top-notifications-a34f
      - cursor/one-click-deploy-a34f
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch to deploy on the live server'
        required: true
        default: 'cursor/one-click-deploy-a34f'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Forks and repos without deploy secrets should skip rather than fail
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Set the DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY secrets to enable automatic deploys."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # A cold build on a 1 GB instance takes a few minutes
          command_timeout: 15m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/home/ubuntu/remote-ops-manager' }}
            BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            ./deploy.sh "$BRANCH"
