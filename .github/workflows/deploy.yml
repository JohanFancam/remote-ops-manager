name: Deploy

# Pushing to a deploy branch updates the live server. Run manually from the
# Actions tab with "Run workflow" when you need to redeploy the same commit.
on:
  push:
    branches:
      - main
      - cursor/modern-standalone-a34f
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Forks and repos without deploy secrets should skip rather than fail
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Set the DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY secrets to enable automatic deploys."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # A cold build on a 1 GB instance takes a few minutes
          command_timeout: 15m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/home/ubuntu/remote-ops-manager' }}
            ./deploy.sh
