<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rom-logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2021" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/api/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html, body { background-color: #1f2021; margin: 0; }
      #root { min-height: 100vh; }
      #rom-boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1f2021;
      }
      #rom-boot img { width: 6rem; height: 6rem; object-fit: contain; }
    </style>
    <title>Remote Ops Manager</title>
  </head>
  <body>
    <div id="root">
      <div id="rom-boot">
        <img src="/rom-logo.png" alt="Remote Ops Manager" />
      </div>
    </div>
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('rom_theme') || '{}');
          var canvas = typeof t.canvas === 'string' && /^#[0-9a-fA-F]{6}$/.test(t.canvas) ? t.canvas : '#1f2021';
          document.documentElement.style.setProperty('--rom-canvas', canvas);
          document.documentElement.style.backgroundColor = canvas;
          document.body.style.backgroundColor = canvas;
          var boot = document.getElementById('rom-boot');
          if (boot) boot.style.background = canvas;
          var img = boot && boot.querySelector('img');
          var logo = typeof t.logo === 'string' ? t.logo.trim() : '';
          if (img && logo) img.src = logo;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
