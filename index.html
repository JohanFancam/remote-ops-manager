<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rom-logo.png" id="rom-favicon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" id="rom-apple-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2021" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/api/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        var canvas = '#1f2021';
        var src = '';
        var splash = false;
        var logo = '';
        try {
          var t = JSON.parse(localStorage.getItem('rom_theme') || '{}');
          if (typeof t.canvas === 'string' && /^#[0-9a-fA-F]{6}$/.test(t.canvas)) canvas = t.canvas;
          splash = typeof t.splash === 'string' ? t.splash.trim() : '';
          logo = typeof t.logo === 'string' ? t.logo.trim() : '';
          src = splash || logo;
        } catch (e) {}
        window.__ROM_BOOT = { canvas: canvas, src: src, isSplash: !!splash };
        document.documentElement.style.setProperty('--rom-canvas', canvas);
        document.documentElement.style.backgroundColor = canvas;
        var icon = logo || src;
        if (icon) {
          var fav = document.getElementById('rom-favicon');
          if (fav) fav.href = icon;
          var apple = document.getElementById('rom-apple-icon');
          if (apple) apple.href = icon;
        }
      })();
    </script>
    <style>
      html, body { background-color: var(--rom-canvas, #1f2021); margin: 0; }
      #root { min-height: 100vh; }
      #rom-boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--rom-canvas, #1f2021);
      }
      #rom-boot img { width: 6rem; height: 6rem; object-fit: contain; }
      html.rom-ready #rom-boot { display: none !important; }
    </style>
    <title>Remote Ops Manager</title>
  </head>
  <body>
    <div id="rom-boot" aria-hidden="true"></div>
    <div id="root"></div>
    <script>
      (function () {
        var b = window.__ROM_BOOT || {};
        var boot = document.getElementById('rom-boot');
        if (!boot) return;
        if (b.canvas) boot.style.background = b.canvas;
        document.body.style.backgroundColor = b.canvas || '#1f2021';
        if (!b.src) return;
        var img = document.createElement('img');
        img.alt = 'Remote Ops Manager';
        img.src = b.src;
        if (b.isSplash) {
          img.style.width = 'auto';
          img.style.height = 'auto';
          img.style.maxWidth = 'min(20rem, 80vw)';
          img.style.maxHeight = '16rem';
        }
        boot.appendChild(img);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
